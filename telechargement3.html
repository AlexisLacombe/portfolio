<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Télécharger les fichiers - Portfolio SI</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Montserrat:wght@600&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg-1: #0f0620;
      --bg-2: #0b1b2b;
      --accent: #7c5cff;
      --accent-2: #00d2ff;
      --success: #00d9a3;
      --card-bg: rgba(255,255,255,0.03);
      --text: #e9eef8;
      --muted: #98a0b3;
      --radius: 14px;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: "Poppins", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color:var(--text);
      background: radial-gradient(1200px 600px at 10% 10%, rgba(124,92,255,0.12), transparent 8%),
                  radial-gradient(1000px 500px at 95% 90%, rgba(0,210,255,0.06), transparent 6%),
                  linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 100%);
      -webkit-font-smoothing:antialiased;
      padding:36px;
      min-height:100vh;
    }

    .container{
      max-width:1000px;
      margin:0 auto;
    }

    .header{
      background:rgba(255,255,255,0.02);
      border:1px solid rgba(255,255,255,0.04);
      border-radius:var(--radius);
      backdrop-filter:blur(8px);
      padding:24px;
      margin-bottom:32px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:16px;
    }

    h1{
      margin:0;
      font-size:24px;
      background: linear-gradient(135deg,var(--accent),var(--accent-2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .back-btn{
      padding:10px 20px;
      border-radius:10px;
      background:rgba(255,255,255,0.06);
      border:1px solid rgba(255,255,255,0.1);
      color:var(--text);
      text-decoration:none;
      font-weight:600;
      font-size:14px;
      transition:all 0.2s ease;
      display:inline-flex;
      align-items:center;
      gap:8px;
    }

    .back-btn:hover{
      background:rgba(255,255,255,0.1);
      transform:translateX(-4px);
    }

    .files-grid{
      display:grid;
      gap:16px;
    }

    .file-card{
      background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
      border: 1px solid rgba(255,255,255,0.05);
      border-radius:var(--radius);
      padding:20px;
      display:flex;
      align-items:center;
      gap:16px;
      transition:all 0.3s ease;
    }

    .file-card:hover{
      background: rgba(255,255,255,0.05);
      border-color:rgba(124,92,255,0.3);
      transform:translateX(8px);
      box-shadow: 0 8px 32px rgba(124,92,255,0.15);
    }

    .file-icon{
      width:56px;
      height:56px;
      border-radius:12px;
      background:linear-gradient(135deg,var(--accent),var(--accent-2));
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:24px;
      flex-shrink:0;
      box-shadow: 0 6px 20px rgba(124,92,255,0.2);
    }

    .file-info{
      flex:1;
      min-width:0;
    }

    .file-name{
      font-weight:600;
      font-size:16px;
      margin:0 0 6px 0;
      color:var(--text);
      word-break:break-all;
    }

    .file-meta{
      display:flex;
      gap:16px;
      font-size:13px;
      color:var(--muted);
    }

    .download-btn{
      padding:12px 24px;
      border-radius:10px;
      background:linear-gradient(90deg,var(--accent),var(--accent-2));
      color:#04101a;
      font-weight:600;
      text-decoration:none;
      box-shadow: 0 6px 18px rgba(124,92,255,0.12);
      transition:all 0.2s ease;
      border:none;
      cursor:pointer;
      font-size:14px;
      white-space:nowrap;
    }

    .download-btn:hover{
      transform:scale(1.05);
      box-shadow: 0 8px 24px rgba(124,92,255,0.24);
    }

    .stats-bar{
      background:rgba(255,255,255,0.02);
      border:1px solid rgba(255,255,255,0.04);
      border-radius:var(--radius);
      padding:16px 24px;
      margin-bottom:24px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      flex-wrap:wrap;
      gap:16px;
    }

    .stat-item{
      display:flex;
      align-items:center;
      gap:8px;
      font-size:14px;
      color:var(--muted);
    }

    .stat-value{
      color:var(--accent-2);
      font-weight:600;
    }

    .empty-state{
      text-align:center;
      padding:60px 20px;
      background:rgba(255,255,255,0.02);
      border:2px dashed rgba(255,255,255,0.1);
      border-radius:var(--radius);
    }

    .empty-icon{
      font-size:64px;
      margin-bottom:16px;
      opacity:0.5;
    }

    .empty-text{
      color:var(--muted);
      font-size:16px;
      margin:0 0 12px 0;
    }

    .empty-help{
      color:var(--muted);
      font-size:14px;
      margin:0;
      line-height:1.6;
    }

    .empty-help code{
      background:rgba(124,92,255,0.2);
      padding:2px 8px;
      border-radius:4px;
      color:var(--accent-2);
      font-size:13px;
    }

    @media (max-width:768px){
      body{padding:20px}
      .header{flex-direction:column; text-align:center}
      .file-card{flex-direction:column; text-align:center}
      .file-meta{justify-content:center; flex-wrap:wrap}
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📁 Documents SI</h1>
      <a href="index.html" class="back-btn">← Retour au portfolio</a>
    </div>

    <div class="stats-bar">
      <div class="stat-item">
        <span>📦 Fichiers totaux :</span>
        <span class="stat-value" id="fileCount">0</span>
      </div>
      <div class="stat-item">
        <span>💾 Taille totale :</span>
        <span class="stat-value" id="totalSize">0 Mo</span>
      </div>
    </div>

    <div class="files-grid" id="filesContainer">
      <!-- Les fichiers seront chargés depuis files3.js -->
    </div>
  </div>

  <script src="files3.js"></script>
  <script>
    // Fonction pour obtenir l'icône selon l'extension
    function getFileIcon(filename) {
      const ext = filename.split('.').pop().toLowerCase();
      const icons = {
        'pdf': '📄',
        'doc': '📝', 'docx': '📝',
        'xls': '📊', 'xlsx': '📊',
        'ppt': '📊', 'pptx': '📊',
        'zip': '🗜️', 'rar': '🗜️', '7z': '🗜️',
        'jpg': '🖼️', 'jpeg': '🖼️', 'png': '🖼️', 'gif': '🖼️',
        'mp4': '🎬', 'avi': '🎬', 'mkv': '🎬',
        'mp3': '🎵', 'wav': '🎵',
        'txt': '📋',
        'py': '🐍',
        'html': '🌐', 'css': '🎨', 'js': '⚡',
      };
      return icons[ext] || '📁';
    }

    // Fonction pour formater la taille
    function formatBytes(bytes) {
      if (bytes >= 1073741824) {
        return (bytes / 1073741824).toFixed(2) + ' Go';
      } else if (bytes >= 1048576) {
        return (bytes / 1048576).toFixed(2) + ' Mo';
      } else if (bytes >= 1024) {
        return (bytes / 1024).toFixed(2) + ' Ko';
      } else {
        return bytes + ' octets';
      }
    }

    // Charger et afficher les fichiers
    function displayFiles() {
      const container = document.getElementById('filesContainer');
      
      // Vérifier si files3.js existe et contient des données
      if (typeof filesList === 'undefined' || !filesList || filesList.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">🐍</div>
            <p class="empty-text">Aucun fichier trouvé</p>
            <p class="empty-help">
              Pour afficher vos fichiers ici :<br>
              1. Mettez vos fichiers dans le dossier <code>fichiers3/</code><br>
              2. Lancez le script <code>generate_files.py</code><br>
              3. Rafraîchissez cette page
            </p>
          </div>
        `;
        return;
      }

      // Calculer le nombre de fichiers et la taille totale
      let totalSize = 0;
      filesList.forEach(file => {
        totalSize += file.size || 0;
      });

      document.getElementById('fileCount').textContent = filesList.length;
      document.getElementById('totalSize').textContent = formatBytes(totalSize);

      // Afficher les fichiers
      let html = '';
      filesList.forEach(file => {
        html += `
          <div class="file-card">
            <div class="file-icon">${getFileIcon(file.name)}</div>
            <div class="file-info">
              <p class="file-name">${file.name}</p>
              <div class="file-meta">
                <span>📏 ${formatBytes(file.size)}</span>
                <span>📅 ${file.date}</span>
              </div>
            </div>
            <a href="fichiers3/${encodeURIComponent(file.name)}" class="download-btn" download>
              ⬇️ Télécharger
            </a>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    // Charger les fichiers au démarrage
    displayFiles();
  </script>
</body>
</html>
